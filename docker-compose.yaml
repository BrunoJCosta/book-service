networks:
  ms:
    name: ms-network
    driver: bridge
    external: true

services:
  back_1:
    build:
      context: .
    container_name: book_01
    image: img_book_java
    ports:
      - "8100:8100"
    expose:
      - 8100
    environment:
      PORT: 8100
      HOST_DB: ${HOST_DB}
      USER_DB: ${USER_DB}
      PASSWORD_DB: ${PASSWORD_DB}
      HOST_REDIS: ${HOST_REDIS}
      HOST_EUREKA: eureka
      SECRET: ${SECRET}
    networks:
      - ms

  back_2:
    build:
      context: .
    container_name: book_02
    image: img_book_java
    ports:
      - "8101:8100"
    expose:
      - 8101
    environment:
      HOST_DB: ${HOST_DB}
      USER_DB: ${USER_DB}
      PASSWORD_DB: ${PASSWORD_DB}
      PORT: 8101
      HOST_EUREKA: eureka
      HOST_REDIS: ${HOST_REDIS}
      SECRET: ${SECRET}
    networks:
      - ms